<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>요일별 연재</title>
  <meta name="description" content="매일 발송한 카드뉴스 공개 아카이브">
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #222222;
      --muted: #9a9a9a;
      --line: #e8e8e8;
      --accent: #13b9b7;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: 0;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .page {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 116px 0 72px;
    }
    .masthead {
      text-align: center;
      margin-bottom: 34px;
    }
    .masthead h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 500;
    }
    .masthead p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--line);
      margin-bottom: 29px;
    }
    .weekday {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 38px;
      color: #969696;
      font-size: 14px;
      position: relative;
    }
    .weekday.active {
      color: #202020;
      font-weight: 500;
    }
    .weekday.active::after {
      content: "";
      position: absolute;
      left: 35%;
      right: 35%;
      bottom: -1px;
      height: 1px;
      background: var(--accent);
    }
    .sort-row {
      display: flex;
      justify-content: flex-end;
      gap: 24px;
      margin: 0 0 28px;
      color: #9b9b9b;
      font-size: 13px;
    }
    .sort-row span:first-child {
      color: #606060;
      position: relative;
    }
    .sort-row span:first-child::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      position: absolute;
      left: -8px;
      top: 7px;
    }
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 20px;
    }
    .archive-card {
      min-height: 152px;
      border: 1px solid var(--line);
      background: #ffffff;
    }
    .card-link {
      min-height: 152px;
      padding: 21px 20px 19px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
    }
    .series {
      margin: 0 0 8px;
      color: #969696;
      font-size: 14px;
      line-height: 1.35;
    }
    .archive-card h2 {
      margin: 0;
      color: #202020;
      font-size: 16px;
      line-height: 1.65;
      font-weight: 400;
    }
    .new-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: 3px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      vertical-align: 1px;
    }
    .byline {
      margin: 18px 0 0;
      color: #aaa;
      font-size: 13px;
      line-height: 1.45;
    }
    .byline em {
      color: #b8b8b8;
      font-family: Georgia, serif;
      font-style: italic;
    }
    .date-label {
      min-width: 86px;
      margin: 0;
      color: #9c9c9c;
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
    }
    .empty {
      grid-column: 1 / -1;
      margin: 0;
      padding: 40px 20px;
      border: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    @media (max-width: 760px) {
      .page {
        width: min(100% - 24px, 520px);
        padding-top: 72px;
      }
      .archive-grid {
        grid-template-columns: 1fr;
      }
      .sort-row {
        gap: 18px;
      }
      .card-link {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .date-label {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>요일별 연재</h1>
      <p>브런치북 오리지널 연재를 만나 보세요.</p>
    </header>
    <nav class="weekdays" aria-label="요일 목록">
      <span class="weekday">월</span>
<span class="weekday">화</span>
<span class="weekday active">수</span>
<span class="weekday">목</span>
<span class="weekday">금</span>
<span class="weekday">토</span>
<span class="weekday">일</span>
    </nav>
    <div class="sort-row" aria-label="정렬 옵션">
      <span>최신순</span>
      <span>응원순</span>
      <span>라이킷순</span>
    </div>
    <section class="archive-grid" aria-label="카드뉴스 목록">
      
      <article class="archive-card">
        <a class="card-link" href="output/morning-insight-cards-2026-06-10.html" aria-label="06월 10일 브리핑 보기">
          <div class="card-copy">
            <p class="series">수요일 카드뉴스</p>
            <h2>06월 10일 브리핑 <span class="new-badge">N</span></h2>
            <p class="byline"><em>by</em> Morning Insight Cards</p>
          </div>
          <p class="date-label">2026.06.10</p>
        </a>
      </article>
    
    </section>
  </main>
</body>
</html>
