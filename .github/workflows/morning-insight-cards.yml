name: Morning Insight Cards

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "index.html"
      - "output/**"
  schedule:
    - cron: "7 23 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  send-morning-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate briefing for push test
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[send-now]')
        run: python src/morning_news.py --force --timezone Asia/Seoul

      - name: Generate and send briefing
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[send-now]')
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: python src/morning_news.py --email --timezone Asia/Seoul

      - name: Build public archive
        run: python src/build_archive.py

      - name: Commit generated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html output/*.html
          git diff --cached --quiet || git commit -m "Update public cardnews archive"
          git push

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload generated HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-insight-cards
          path: |
            output/*.html
            logs/*.log
          if-no-files-found: ignore
